stages:
  - build
  - test
  - package

build:
  stage: build
  image: eclipse-temurin:24-jdk
  script:
    - chmod +x ./mvnw
    - ./mvnw clean install -DskipTests
  artifacts:
      paths:
        - target/*.jar
      expire_in: 1 year

test:
  stage: test
  image: eclipse-temurin:24-jdk
  script:
    - chmod +x ./mvnw
    - ./mvnw test

image publish:
  stage: package
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG_LATEST: $CI_REGISTRY_IMAGE:latest
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - export IMAGE_TAG=$CI_REGISTRY_IMAGE:$(date +"%Y%m%d%H%M%S")-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  script:
    - docker build -t $IMAGE_TAG -t $IMAGE_TAG_LATEST .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TAG_LATEST
  only:
    - main
