              - column:
                  name: provider_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: provider_state
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: provider_auth_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: provider_location
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: client_id
                  type: varchar(255)
              - column:
                  name: client_secret
                  type: varchar(255)
              - column:
                  name: redirect_uri
                  type: varchar(500)
              - column:
                  name: scopes
                  type: varchar(255)
              - column:
                  name: tenant_id
                  type: varchar(500)
              - column:
                  name: api_key
                  type: varchar(500)
              - column:
                  name: impersonated_user_email
                  type: varchar(100)
              - column:
                  name: drive_id
