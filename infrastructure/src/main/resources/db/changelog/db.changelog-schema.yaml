              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: deleted_by
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp

  - changeSet:
      id: 6-create-provider-indexes
      author: media
      changes:
        - createIndex:
            indexName: idx_provider_uuid
            tableName: provider
            columns:
              - column:
                  name: uuid
        - createIndex:
            indexName: idx_provider_type
            tableName: provider
            columns:
              - column:
