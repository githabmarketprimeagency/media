  - changeSet:
      id: 4-create-indexes
      author: boilerplate
      changes:
        - createIndex:
            indexName: idx_request_check_uuid
            tableName: request_check
            columns:
              - column:
                  name: uuid
        - createIndex:
            indexName: idx_request_spam_url_content
            tableName: request_spam
            columns:
              - column:
                  name: url
              - column:
                  name: content
        - createIndex:
            indexName: idx_user_spam_user_ip
            tableName: user_spam
            columns:
              - column:
                  name: user_ip

  - changeSet:
      id: 5-create-provider-table
      author: media
      changes:
        - createTable:
            tableName: provider
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
