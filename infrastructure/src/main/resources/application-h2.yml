spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:boilerplate-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-main.yaml
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
