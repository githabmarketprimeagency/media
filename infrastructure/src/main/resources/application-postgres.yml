spring:
  application:
    name: Boilerplate
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:54322/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-main.yaml
    enabled: true
server:
  port: ${PORT:8080}
